name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: brew install lua
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Resolve dependencies
        run: swift package resolve
      # Socket integration tests run in their own process: their async handler
      # needs a cooperative-pool thread, which CPU-bound unit suites can hold
      # for seconds on a 3-core runner.
      - name: Run unit tests
        run: swift test --disable-sandbox --scratch-path .build/ci-tests --skip IPCTransportTests
      - name: Run IPC integration tests
        run: swift test --disable-sandbox --scratch-path .build/ci-tests --filter IPCTransportTests

  sanitizer:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: brew install lua
      - name: Run ${{ matrix.sanitizer }} sanitizer
        run: >-
          swift test
          --disable-sandbox
          --sanitize=${{ matrix.sanitizer }}
          --scratch-path .build/${{ matrix.sanitizer }}-sanitizer
          --skip IPCTransportTests
      - name: Run ${{ matrix.sanitizer }} sanitizer on IPC integration tests
        run: >-
          swift test
          --disable-sandbox
          --sanitize=${{ matrix.sanitizer }}
          --scratch-path .build/${{ matrix.sanitizer }}-sanitizer
          --filter IPCTransportTests

  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: brew install lua
      - name: Read package version
        run: echo "NARWHAL_VERSION=$(plutil -extract CFBundleShortVersionString raw Packaging/NarwhalInfo.plist)" >> "$GITHUB_ENV"
      - name: Build arm64 package
        run: >-
          scripts/build_app_bundle.sh
          --configuration release
          --output .build/ci-package
          --version ${{ env.NARWHAL_VERSION }}
          --build-number ${{ github.run_number }}
          --architecture arm64
          --replace
      - name: Verify package
        run: >-
          scripts/verify_app_bundle.sh
          --app .build/ci-package/Narwhal.app
          --version ${{ env.NARWHAL_VERSION }}
          --build-number ${{ github.run_number }}
          --architecture arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Narwhal-unsigned-${{ github.sha }}
          path: .build/ci-package/Narwhal.app
          if-no-files-found: error
